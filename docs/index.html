<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>校园生活指南 · 地图导览</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --brand: #00b578;
    --brand-deep: #009963;
    --glass: rgba(255,255,255,.78);
    --glass-border: rgba(255,255,255,.6);
    --shadow: 0 8rpx 32rpx rgba(15,23,42,.12);
    --text: #0f172a;
    --text-sub: #64748b;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; }
  #map { position:absolute; inset:0; z-index:0; }

  /* ========== 玻璃拟态通用 ========== */
  .glass {
    background: var(--glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    box-shadow: 0 8px 32px rgba(15,23,42,.12);
  }

  /* ========== 顶部悬浮：搜索栏 + 分类胶囊 ========== */
  .top-float {
    position:absolute; top:0; left:0; right:0; z-index:20;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px 0;
    pointer-events:none;
  }
  .search-bar {
    display:flex; align-items:center; gap:8px;
    border-radius:24px; padding:10px 16px;
    pointer-events:auto;
  }
  .search-bar .icon { font-size:16px; }
  .search-bar input {
    flex:1; border:none; outline:none; background:transparent;
    font-size:14px; color:var(--text);
  }
  .search-bar .clear-btn { font-size:14px; color:#94a3b8; cursor:pointer; display:none; }
  .cat-row {
    display:flex; gap:8px; overflow-x:auto; padding:10px 2px 14px;
    pointer-events:auto; scrollbar-width:none;
  }
  .cat-row::-webkit-scrollbar { display:none; }
  .cat-chip {
    flex-shrink:0; display:flex; align-items:center; gap:4px;
    padding:7px 14px; border-radius:20px; font-size:13px;
    color:var(--text); cursor:pointer; white-space:nowrap;
    background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--glass-border);
    box-shadow:0 4px 12px rgba(15,23,42,.08);
    transition:all .2s;
  }
  .cat-chip.on {
    background:var(--brand); color:#fff; border-color:var(--brand);
    box-shadow:0 4px 16px rgba(0,181,120,.4);
  }

  /* ========== 底部抽屉 ========== */
  .drawer {
    position:absolute; left:10px; right:10px; z-index:15;
    border-radius:24px 24px 0 0;
    transition:transform .35s cubic-bezier(.3,.9,.35,1);
    display:flex; flex-direction:column;
    height:320px;
    bottom:0;
  }
  .drawer.collapsed { transform:translateY(calc(100% - 52px)); }
  .drawer-handle {
    flex-shrink:0; height:52px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; cursor:pointer; user-select:none;
  }
  .drawer-handle .bar { width:40px; height:5px; border-radius:3px; background:#cbd5e1; }
  .drawer-title { font-size:14px; font-weight:700; color:var(--text); margin-top:5px; }
  .drawer-list { flex:1; overflow-y:auto; padding:0 14px 16px; }
  .poi-item {
    display:flex; align-items:center; gap:10px;
    padding:11px 10px; border-radius:14px; cursor:pointer;
    transition:background .15s;
  }
  .poi-item:active { background:rgba(0,181,120,.08); }
  .poi-emoji {
    width:38px; height:38px; border-radius:12px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:18px;
  }
  .poi-info { flex:1; min-width:0; }
  .poi-name { font-size:14px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .poi-desc { font-size:11px; color:var(--text-sub); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .poi-dist { flex-shrink:0; font-size:12px; color:var(--brand); font-weight:600; }
  .list-empty { text-align:center; color:#94a3b8; font-size:13px; padding:30px 0; }

  /* ========== 选点卡 ========== */
  .bar {
    position:absolute; left:10px; right:10px; bottom:16px; z-index:25;
    border-radius:20px; padding:14px 16px;
    transform:translateY(140%); transition:transform .3s cubic-bezier(.3,.9,.35,1);
  }
  .bar.show { transform:translateY(0); }
  .bar-name { font-size:17px; font-weight:800; color:var(--text); }
  .bar-meta { font-size:12px; color:var(--text-sub); margin-top:4px; }
  .bar-actions { display:flex; gap:10px; margin-top:12px; }
  .bar-btn {
    flex:1; height:40px; border-radius:20px; border:none;
    font-size:14px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:4px;
  }
  .bar-btn.primary { background:var(--brand); color:#fff; box-shadow:0 4px 16px rgba(0,181,120,.4); }
  .bar-btn.ghost { background:rgba(15,23,42,.06); color:var(--text); }
  .bar-close {
    position:absolute; left:10px; z-index:26; width:30px; height:30px;
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:13px; color:#64748b; cursor:pointer;
    transform:translateY(20px); opacity:0; transition:all .3s;
    bottom:136px;
  }
  .bar-close.show { transform:translateY(0); opacity:1; }

  /* ========== 悬浮按钮 ========== */
  .fab-stack {
    position:absolute; right:12px; z-index:18;
    display:flex; flex-direction:column; gap:10px;
    transition:bottom .35s cubic-bezier(.3,.9,.35,1);
    bottom:336px;
  }
  .fab {
    width:46px; height:46px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; cursor:pointer; border:1px solid var(--glass-border);
    background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    box-shadow:0 6px 20px rgba(15,23,42,.15);
    transition:all .2s;
  }
  .fab.on { background:var(--brand); box-shadow:0 6px 20px rgba(0,181,120,.45); }
  .fab:active { transform:scale(.92); }

  /* ========== Leaflet 覆盖样式 ========== */
  .poi-label {
    background:#fff !important; border:1px solid #e2e8f0 !important;
    border-radius:8px !important; padding:2px 6px !important;
    font-size:10px !important; color:#1e293b !important;
    box-shadow:0 2px 8px rgba(15,23,42,.1) !important;
  }
  .poi-label::before { display:none; }
  .pin-wrap { position:relative; width:32px; height:40px; }
  .pin-wrap img { width:32px; height:40px; filter:drop-shadow(0 3px 4px rgba(15,23,42,.3)); }
  .leaflet-container { font:inherit; }

  /* toast */
  .toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(15,23,42,.85); color:#fff; padding:10px 20px;
    border-radius:12px; font-size:13px; z-index:99; opacity:0;
    transition:opacity .25s; pointer-events:none; text-align:center; max-width:70vw;
  }
  .toast.show { opacity:1; }
</style>
</head>
<body>

<div id="map"></div>

<!-- 顶部：搜索 + 分类 -->
<div class="top-float">
  <div class="search-bar glass">
    <span class="icon">🔍</span>
    <input id="searchInput" type="text" placeholder="搜索教学楼 / 宿舍 / 餐厅…">
    <span class="clear-btn" id="clearBtn">✕</span>
  </div>
  <div class="cat-row" id="catRow"></div>
</div>

<!-- 底部抽屉 -->
<div class="drawer glass" id="drawer">
  <div class="drawer-handle" id="drawerHandle">
    <div class="bar"></div>
    <div class="drawer-title" id="drawerTitle">附近点位</div>
  </div>
  <div class="drawer-list" id="drawerList"></div>
</div>

<!-- 悬浮按钮 -->
<div class="fab-stack" id="fabStack">
  <div class="fab" id="fabBasemap" title="切换底图">🎨</div>
  <div class="fab" id="fabLocate" title="定位">◎</div>
  <div class="fab on" id="fabLabel" title="标注开关">🏷️</div>
</div>

<!-- 选点卡 -->
<div class="bar-close glass" id="barClose">✕</div>
<div class="bar glass" id="bar">
  <div class="bar-name" id="barName"></div>
  <div class="bar-meta" id="barMeta"></div>
  <div class="bar-actions">
    <button class="bar-btn ghost" id="barFocus">🔎 查看</button>
    <button class="bar-btn primary" id="barNav">🧭 去这里</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="campus-data.js"></script>
<script>
/* ============================================================
   校园生活指南 · 网页版
   ⚠️ 如需「去这里」跳转腾讯地图导航：到 lbs.qq.com 免费申请 key 填入下方
   ============================================================ */
const QQ_MAP_KEY = ''; // ← 腾讯地图 Web key，申请后填这里
const MAPBOX_TOKEN = ''; // ← 想要 Mapbox 底图：mapbox.com 免费注册拿 token 填这里（每月 5 万次免费加载）

/* ---------- 坐标纠偏：GCJ-02 ⇄ WGS-84 ----------
   数据源是 GCJ-02（腾讯/高德系）；国际底图（CARTO/Mapbox/Esri）是 WGS-84
   标准换算算法，误差 < 1m */
const _PI = Math.PI, _A = 6378245.0, _EE = 0.00669342162296594323;
function _tLat(x, y) { let r = -100 + 2*x + 3*y + .2*y*y + .1*x*y + .2*Math.sqrt(Math.abs(x)); r += (20*Math.sin(6*x*_PI) + 20*Math.sin(2*x*_PI))*2/3; r += (20*Math.sin(y*_PI) + 40*Math.sin(y/3*_PI))*2/3; r += (160*Math.sin(y/12*_PI) + 320*Math.sin(y*_PI/30))*2/3; return r; }
function _tLng(x, y) { let r = 300 + x + 2*y + .1*x*x + .1*x*y + .1*Math.sqrt(Math.abs(x)); r += (20*Math.sin(6*x*_PI) + 20*Math.sin(2*x*_PI))*2/3; r += (20*Math.sin(x*_PI) + 40*Math.sin(x/3*_PI))*2/3; r += (150*Math.sin(x/12*_PI) + 300*Math.sin(x/30*_PI))*2/3; return r; }
function _delta(lat, lng) { let dLat = _tLat(lng-105, lat-35), dLng = _tLng(lng-105, lat-35); const rad = lat/180*_PI; let magic = Math.sin(rad); magic = 1 - _EE*magic*magic; const sq = Math.sqrt(magic); dLat = dLat*180/((_A*(1-_EE))/(magic*sq)*_PI); dLng = dLng*180/(_A/sq*Math.cos(rad)*_PI); return { lat: dLat, lng: dLng }; }
function gcj2wgs(lat, lng) { const d = _delta(lat, lng); return { lat: lat-d.lat, lng: lng-d.lng }; }
function wgs2gcj(lat, lng) { const d = _delta(lat, lng); return { lat: lat+d.lat, lng: lng+d.lng }; }

/* ---------- 底图配置（🎨 按钮循环切换） ---------- */
const BASEMAPS = [
  { key: 'voyager', name: 'Voyager · 清新明亮', wgs: true,
    url: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    opts: { subdomains: 'abcd', maxZoom: 20, attribution: '© CARTO © OpenStreetMap' } },
  { key: 'positron', name: 'Positron · 极简灰', wgs: true,
    url: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    opts: { subdomains: 'abcd', maxZoom: 20, attribution: '© CARTO © OpenStreetMap' } },
  { key: 'dark', name: 'Dark Matter · 夜景', wgs: true,
    url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    opts: { subdomains: 'abcd', maxZoom: 20, attribution: '© CARTO © OpenStreetMap' } },
  { key: 'sat', name: 'Esri · 卫星影像', wgs: true,
    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    opts: { maxZoom: 19, attribution: '© Esri' } },
  { key: 'tencent', name: '腾讯官方', wgs: false,
    url: 'https://rt{s}.map.gtimg.com/tile?z={z}&x={x}&y={-y}&type=vector&styleid=3',
    opts: { subdomains: ['0','1','2','3'], tms: true, maxZoom: 19 } },
];
if (MAPBOX_TOKEN) BASEMAPS.unshift({ key: 'mapbox', name: 'Mapbox Streets', wgs: true,
  url: `https://api.mapbox.com/styles/v1/mapbox/streets-v12/tiles/{z}/{x}/{y}{r}?access_token=${MAPBOX_TOKEN}`,
  opts: { maxZoom: 20, attribution: '© Mapbox © OpenStreetMap', tileSize: 512, zoomOffset: -1 } });
let basemapIdx = 0;
let currentTile = null;
// 数据坐标(GCJ-02 或 WGS-84) → 当前底图坐标
function toMapLatLng(lat, lng, isWgs) {
  const bm = BASEMAPS[basemapIdx];
  if (bm.wgs) { if (isWgs) return [lat, lng]; const w = gcj2wgs(lat, lng); return [w.lat, w.lng]; }
  if (isWgs) { const g = wgs2gcj(lat, lng); return [g.lat, g.lng]; }
  return [lat, lng];
}

const { CAMPUS_CENTER, POIS, CATEGORY_META } = window.CAMPUS_DATA;
const CAT_KEYS = Object.keys(CATEGORY_META);

let map, markerLayer, meMarker;
let currentCat = 'all';        // 当前分类
let keyword = '';              // 搜索关键词
let showLabel = true;          // 名称标注开关
let myPos = null;              // 我的位置
let selected = null;           // 当前选中点位
const markers = {};            // id -> marker

/* ---------- 工具 ---------- */
const $ = id => document.getElementById(id);
function toast(msg, ms = 2000) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), ms);
}
function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function fmtDist(m) { return m < 1000 ? Math.round(m) + ' m' : (m/1000).toFixed(1) + ' km'; }

/* ---------- 地图初始化 ---------- */
function initMap() {
  map = L.map('map', { zoomControl: false, attributionControl: false })
    .setView(toMapLatLng(CAMPUS_CENTER.lat, CAMPUS_CENTER.lng, false), 16);
  currentTile = L.tileLayer(BASEMAPS[basemapIdx].url, BASEMAPS[basemapIdx].opts).addTo(map);
  markerLayer = L.layerGroup().addTo(map);
  renderMarkers();
}

/* ---------- Marker 渲染 ---------- */
function filteredPois() {
  return POIS.filter(p => {
    if (currentCat !== 'all' && p.category !== currentCat) return false;
    if (keyword && !p.name.includes(keyword)) return false;
    return true;
  });
}
function renderMarkers() {
  markerLayer.clearLayers();
  filteredPois().forEach(p => {
    const icon = L.divIcon({
      className: '',
      html: `<div class="pin-wrap"><img src="pins/${p.category}.png" alt=""></div>`,
      iconSize: [32, 40], iconAnchor: [16, 38],
    });
    const m = L.marker(toMapLatLng(p.lat, p.lng, false), { icon }).on('click', () => showPoi(p));
    if (showLabel) {
      m.bindTooltip(p.name, {
        permanent: true, direction: 'top', offset: [-4, -36], className: 'poi-label',
      });
    }
    m.addTo(markerLayer);
    markers[p.id] = m;
  });
  renderList();
}

/* ---------- 分类胶囊 ---------- */
function renderCats() {
  const row = $('catRow');
  row.innerHTML = '';
  const all = document.createElement('div');
  all.className = 'cat-chip' + (currentCat === 'all' ? ' on' : '');
  all.textContent = '🗺️ 全部';
  all.onclick = () => switchCat('all');
  row.appendChild(all);
  CAT_KEYS.forEach(k => {
    const meta = CATEGORY_META[k];
    const chip = document.createElement('div');
    chip.className = 'cat-chip' + (currentCat === k ? ' on' : '');
    chip.textContent = meta.icon + ' ' + meta.label;
    chip.onclick = () => switchCat(k);
    row.appendChild(chip);
  });
}
function switchCat(k) { currentCat = k; renderCats(); renderMarkers(); }

/* ---------- 抽屉列表 ---------- */
// myPos 存的是 WGS-84，点位是 GCJ-02，算距离前统一转 WGS-84
function distToMe(p) { const w = gcj2wgs(p.lat, p.lng); return haversine(myPos.lat, myPos.lng, w.lat, w.lng); }
function renderList() {
  let list = filteredPois();
  if (myPos) {
    list = list.map(p => ({ ...p, _d: distToMe(p) }))
               .sort((a, b) => a._d - b._d);
  }
  $('drawerTitle').textContent =
    (currentCat === 'all' ? '附近点位' : CATEGORY_META[currentCat].label) + `（${list.length}）`;
  const box = $('drawerList');
  box.innerHTML = '';
  if (!list.length) { box.innerHTML = '<div class="list-empty">没有匹配的点位</div>'; return; }
  list.forEach(p => {
    const meta = CATEGORY_META[p.category];
    const item = document.createElement('div');
    item.className = 'poi-item';
    item.innerHTML = `
      <div class="poi-emoji" style="background:${meta.color}1a">${meta.icon}</div>
      <div class="poi-info">
        <div class="poi-name">${p.name}</div>
        <div class="poi-desc">${meta.label} · ${p.desc || ''}</div>
      </div>
      ${p._d != null ? `<div class="poi-dist">${fmtDist(p._d)}</div>` : ''}
    `;
    item.onclick = () => { flyTo(p); showPoi(p); };
    box.appendChild(item);
  });
}

/* ---------- 抽屉收起/展开（点击 + 拖拽） ---------- */
let collapsed = false;
function setCollapsed(v) {
  collapsed = v;
  $('drawer').classList.toggle('collapsed', v);
  $('fabStack').style.bottom = v ? '80px' : '336px';
}
(function initDrawerGesture() {
  const handle = $('drawerHandle');
  let startY = 0, startCollapsed = false, moved = false;
  handle.addEventListener('touchstart', e => {
    startY = e.touches[0].clientY; startCollapsed = collapsed; moved = false;
  }, { passive: true });
  handle.addEventListener('touchmove', e => {
    if (Math.abs(e.touches[0].clientY - startY) > 8) moved = true;
  }, { passive: true });
  handle.addEventListener('touchend', e => {
    const dy = e.changedTouches[0].clientY - startY;
    if (moved) { setCollapsed(dy > 30 ? true : dy < -30 ? false : startCollapsed); }
    else { setCollapsed(!collapsed); } // 点击切换
  });
  // 桌面端鼠标点击切换
  handle.addEventListener('click', e => {
    if (!('ontouchstart' in window)) setCollapsed(!collapsed);
  });
})();

/* ---------- 选点卡 ---------- */
function flyTo(p) { map.flyTo(toMapLatLng(p.lat, p.lng, false), Math.max(map.getZoom(), 17), { duration: .6 }); }
function showPoi(p) {
  selected = p;
  const meta = CATEGORY_META[p.category];
  let distStr = '';
  if (myPos) distStr = ` · 距你 ${fmtDist(distToMe(p))}`;
  $('barName').textContent = meta.icon + ' ' + p.name;
  $('barMeta').textContent = `${meta.label}${p.desc ? ' · ' + p.desc : ''}${distStr}`;
  $('bar').classList.add('show');
  $('barClose').classList.add('show');
}
function closeBar() {
  selected = null;
  $('bar').classList.remove('show');
  $('barClose').classList.remove('show');
}
$('barClose').onclick = closeBar;
$('barFocus').onclick = () => selected && flyTo(selected);
$('barNav').onclick = () => {
  if (!selected) return;
  const { lat, lng, name } = selected;
  if (QQ_MAP_KEY) {
    // 腾讯地图 URI API：从我的位置步行导航过去（手机打开体验最佳）
    const url = `https://apis.map.qq.com/uri/v1/routeplan?type=walk&tocoord=${lat},${lng}&to=${encodeURIComponent(name)}&referer=${QQ_MAP_KEY}`;
    window.open(url, '_blank');
  } else {
    // 未配置 key：地图画直线示意 + 打开腾讯地图网页版
    drawRouteLine(selected);
    toast('未配置腾讯地图 key，已画直线示意；申请 key 后可跳转步行导航', 2600);
    window.open(`https://map.qq.com/m/?type=search&word=${encodeURIComponent(name + ' 山西师范大学')}`, '_blank');
  }
};
let routeLine = null;
function drawRouteLine(p) {
  if (routeLine) map.removeLayer(routeLine);
  const from = myPos ? toMapLatLng(myPos.lat, myPos.lng, true)
                     : toMapLatLng(CAMPUS_CENTER.lat, CAMPUS_CENTER.lng, false);
  routeLine = L.polyline([from, toMapLatLng(p.lat, p.lng, false)], {
    color: '#00b578', weight: 3, dashArray: '8 8', opacity: .85,
  }).addTo(map);
  map.fitBounds(routeLine.getBounds(), { padding: [60, 60] });
}

/* ---------- 定位 ---------- */
$('fabLocate').onclick = () => {
  if (!navigator.geolocation) { toast('浏览器不支持定位'); return; }
  toast('定位中…', 1200);
  navigator.geolocation.getCurrentPosition(pos => {
    // 浏览器原生返回 WGS-84；myPos 统一存 WGS-84，显示时按底图坐标系转换
    myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    const ll = toMapLatLng(myPos.lat, myPos.lng, true);
    if (!meMarker) {
      meMarker = L.circleMarker(ll, {
        radius: 8, color: '#fff', weight: 3, fillColor: '#3b82f6', fillOpacity: 1,
      }).addTo(map).bindTooltip('我的位置', { direction: 'top', offset: [0, -8] });
    } else { meMarker.setLatLng(ll); }
    map.flyTo(ll, 17, { duration: .8 });
    renderList();
  }, err => {
    toast('定位失败：' + (err.code === 1 ? '请允许位置权限' : err.message), 2600);
  }, { enableHighAccuracy: true, timeout: 8000 });
};

/* ---------- 底图切换 ---------- */
$('fabBasemap').onclick = () => {
  basemapIdx = (basemapIdx + 1) % BASEMAPS.length;
  const bm = BASEMAPS[basemapIdx];
  if (currentTile) map.removeLayer(currentTile);
  currentTile = L.tileLayer(bm.url, bm.opts).addTo(map);
  currentTile.bringToBack();
  renderMarkers(); // 坐标系变了，marker 重摆
  if (meMarker && myPos) meMarker.setLatLng(toMapLatLng(myPos.lat, myPos.lng, true));
  if (routeLine && selected) drawRouteLine(selected);
  toast('底图：' + bm.name, 1400);
};

/* ---------- 标注开关 ---------- */
$('fabLabel').onclick = () => {
  showLabel = !showLabel;
  $('fabLabel').classList.toggle('on', showLabel);
  renderMarkers();
  toast(showLabel ? '已显示点位名称' : '已隐藏点位名称', 1200);
};

/* ---------- 搜索 ---------- */
$('searchInput').addEventListener('input', e => {
  keyword = e.target.value.trim();
  $('clearBtn').style.display = keyword ? 'block' : 'none';
  renderMarkers();
});
$('clearBtn').onclick = () => {
  $('searchInput').value = ''; keyword = '';
  $('clearBtn').style.display = 'none';
  renderMarkers();
};

/* ---------- 启动 ---------- */
renderCats();
initMap();
setCollapsed(false);
</script>
</body>
</html>
