<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebGIS 学习之旅 · Progress Dashboard</title>
<style>
  :root {
    --bg: #070b14;
    --card: rgba(255,255,255,.04);
    --border: rgba(255,255,255,.09);
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --green: #4ade80;
    --amber: #fbbf24;
    --violet: #a78bfa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh; overflow-x: hidden;
  }
  /* 背景光晕 */
  .glow { position: fixed; border-radius: 50%; filter: blur(120px); opacity: .16; pointer-events: none; z-index: 0; }
  .glow-1 { width: 600px; height: 600px; background: #0ea5e9; top: -200px; right: -150px; }
  .glow-2 { width: 500px; height: 500px; background: #8b5cf6; bottom: -200px; left: -150px; }
  /* 网格纹理 */
  .grid-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .5;
    background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse at 50% 0%, black 30%, transparent 75%);
  }
  .wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 64px 24px 100px; }

  /* ============ Hero ============ */
  .hero { text-align: center; margin-bottom: 56px; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--border); background: var(--card);
    padding: 6px 16px; border-radius: 999px; font-size: 13px; color: var(--muted);
    margin-bottom: 20px; backdrop-filter: blur(8px);
  }
  .badge .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 rgba(74,222,128,.6); animation: pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 9px rgba(74,222,128,0); } 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); } }
  .hero h1 {
    font-size: clamp(34px, 6vw, 54px); font-weight: 800; letter-spacing: -.02em; line-height: 1.15;
    background: linear-gradient(135deg, #f8fafc 30%, #7dd3fc 70%, #a78bfa);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 16px;
  }
  .hero p { color: var(--muted); font-size: 16px; max-width: 560px; margin: 0 auto; line-height: 1.8; }
  .hero .tags { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
  .tag {
    font-size: 12px; padding: 5px 12px; border-radius: 6px;
    background: var(--card); border: 1px solid var(--border); color: var(--muted);
    font-family: ui-monospace, Consolas, monospace;
  }

  /* ============ 统计卡 ============ */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 56px; }
  .stat {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 22px 18px; backdrop-filter: blur(12px); text-align: center;
    transition: transform .25s ease, border-color .25s ease;
  }
  .stat:hover { transform: translateY(-3px); border-color: rgba(56,189,248,.35); }
  .stat .num { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat .label { font-size: 12.5px; color: var(--muted); margin-top: 6px; letter-spacing: .04em; }
  .c-sky { color: var(--accent); } .c-green { color: var(--green); }
  .c-amber { color: var(--amber); } .c-violet { color: var(--violet); }

  /* ============ 总进度条 ============ */
  .overall { margin-bottom: 64px; }
  .overall .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .overall .row h2 { font-size: 17px; font-weight: 700; }
  .overall .row span { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .bar { height: 10px; border-radius: 999px; background: rgba(255,255,255,.06); overflow: hidden; }
  .bar > div {
    height: 100%; border-radius: 999px; width: 0;
    background: linear-gradient(90deg, #0ea5e9, #38bdf8, #a78bfa);
    background-size: 200% 100%; animation: shimmer 3s linear infinite;
    transition: width 1.2s cubic-bezier(.22,1,.36,1);
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* ============ 路线图 ============ */
  .roadmap { position: relative; padding-left: 34px; }
  .roadmap::before {
    content: ''; position: absolute; left: 9px; top: 8px; bottom: 8px; width: 2px;
    background: linear-gradient(180deg, var(--accent), var(--violet), rgba(167,139,250,.1));
  }
  .stage { position: relative; margin-bottom: 40px; }
  .stage-dot {
    position: absolute; left: -34px; top: 4px; width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--accent); background: var(--bg); z-index: 2;
    display: flex; align-items: center; justify-content: center; font-size: 10px;
  }
  .stage.done .stage-dot { background: var(--green); border-color: var(--green); }
  .stage.doing .stage-dot { border-color: var(--amber); box-shadow: 0 0 14px rgba(251,191,36,.5); }
  .stage-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    padding: 24px 26px; backdrop-filter: blur(12px);
    transition: border-color .25s ease, transform .25s ease;
  }
  .stage-card:hover { border-color: rgba(56,189,248,.3); transform: translateX(4px); }
  .stage-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .stage-head .no {
    font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--accent);
    border: 1px solid rgba(56,189,248,.3); padding: 3px 9px; border-radius: 6px;
  }
  .stage-head h3 { font-size: 19px; font-weight: 700; }
  .stage-head .tech { font-size: 12px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; }
  .stage-desc { color: var(--muted); font-size: 13.5px; line-height: 1.7; margin-bottom: 14px; }
  .stage-progress { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .stage-progress .bar { flex: 1; height: 6px; }
  .stage-progress span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 58px; text-align: right; }

  .lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .lesson {
    display: flex; align-items: center; gap: 11px; text-decoration: none;
    border: 1px solid var(--border); border-radius: 11px; padding: 11px 14px;
    background: rgba(255,255,255,.02); transition: all .2s ease; cursor: pointer;
  }
  .lesson:hover { background: rgba(56,189,248,.08); border-color: rgba(56,189,248,.35); transform: translateY(-2px); }
  .lesson .icon {
    width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
    background: rgba(148,163,184,.12); color: var(--muted);
  }
  .lesson.doing .icon { background: rgba(251,191,36,.15); color: var(--amber); }
  .lesson .title { font-size: 13.5px; color: var(--text); line-height: 1.4; }
  .lesson .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .lesson .arrow { margin-left: auto; color: var(--muted); font-size: 12px; opacity: 0; transition: opacity .2s; }
  .lesson:hover .arrow { opacity: 1; }

  /* ============ 时间线 ============ */
  .timeline-section { margin-top: 72px; }
  .timeline-section h2 { font-size: 20px; margin-bottom: 22px; font-weight: 700; }
  .timeline-section h2 span { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 10px; }
  .tl-item {
    display: flex; gap: 16px; padding: 16px 0; border-bottom: 1px dashed rgba(255,255,255,.08);
  }
  .tl-date {
    font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; color: var(--accent);
    min-width: 100px; padding-top: 2px;
  }
  .tl-body { font-size: 14px; line-height: 1.75; color: var(--text); }
  .tl-body .muted { color: var(--muted); font-size: 13px; }

  footer { margin-top: 80px; text-align: center; color: var(--muted); font-size: 12.5px; line-height: 2; }
  footer a { color: var(--accent); text-decoration: none; }
  @media (max-width: 640px) {
    .roadmap { padding-left: 28px; }
    .roadmap::before { left: 7px; }
    .stage-dot { left: -28px; width: 16px; height: 16px; }
  }
</style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="grid-bg"></div>

  <div class="wrap">
    <!-- Hero -->
    <header class="hero">
      <div class="badge"><span class="pulse"></span>学习进行中 · 2026</div>
      <h1>WebGIS 学习之旅</h1>
      <p>从二维到三维，从简单到复杂。用 AI 辅助开发的系统化 WebGIS 实战路线，每一步都留下代码与记录。</p>
      <div class="tags">
        <span class="tag">Leaflet</span><span class="tag">turf.js</span>
        <span class="tag">MapLibre GL</span><span class="tag">CesiumJS</span>
        <span class="tag">GeoJSON</span><span class="tag">PostGIS</span>
      </div>
    </header>

    <!-- 统计 -->
    <section class="stats" id="stats"></section>

    <!-- 总进度 -->
    <section class="overall">
      <div class="row"><h2>总进度</h2><span id="overall-text">0%</span></div>
      <div class="bar"><div id="overall-bar"></div></div>
    </section>

    <!-- 路线图 -->
    <section class="roadmap" id="roadmap"></section>

    <!-- 学习时间线 -->
    <section class="timeline-section">
      <h2>学习时间线 <span>Learning Log · 同步至 PROGRESS.md</span></h2>
      <div id="timeline"></div>
    </section>

    <footer>
      Data-driven progress page · 课程均为可直接运行的独立 HTML ·
      技术选型参考 <a href="https://github.com/sshuair/awesome-gis" target="_blank">awesome-gis</a><br>
      Powered by AI-assisted learning 🚀
    </footer>
  </div>

<script>
// ================================================================
// 数据区：完成课程后改 status（done / doing / todo）即可，页面自动更新
// status: done=已完成  doing=进行中  todo=未开始
// ================================================================
const START_DATE = '2026-08-18';   // 学习开始日期

const STAGES = [
  {
    no: '01', title: '二维地图入门', tech: 'Leaflet',
    desc: '地图初始化、瓦片原理、标记与弹窗、GeoJSON 图层、专题图制作 —— WebGIS 的地基。',
    lessons: [
      { file: 'lessons/01-leaflet-basics/01-first-map.html',        title: '我的第一个地图',      sub: '初始化 / 瓦片 / 事件', status: 'doing' },
      { file: 'lessons/01-leaflet-basics/02-markers-popups.html',   title: '标记、弹窗与图标',    sub: 'Marker / divIcon',     status: 'todo' },
      { file: 'lessons/01-leaflet-basics/03-geojson-layers.html',   title: 'GeoJSON 图层与样式',  sub: '数据驱动样式',         status: 'todo' },
      { file: 'lessons/01-leaflet-basics/04-choropleth.html',       title: '分级统计图',          sub: 'Choropleth / 图例',    status: 'todo' },
    ]
  },
  {
    no: '02', title: '地图交互工具', tech: 'Leaflet-Geoman',
    desc: '图形绘制与编辑、坐标拾取、坐标系偏移（火星坐标）、底图切换 —— 交互系统的骨架。',
    lessons: [
      { file: 'lessons/02-interactive-tools/01-draw-tools.html',        title: '绘制与编辑工具',      sub: '画点线面 / 导出',       status: 'todo' },
      { file: 'lessons/02-interactive-tools/02-coordinate-picker.html', title: '坐标拾取与图层控制',  sub: 'WGS84↔GCJ02',          status: 'todo' },
    ]
  },
  {
    no: '03', title: '空间分析', tech: 'turf.js',
    desc: '距离与面积测量、缓冲区分析、空间查询判断 —— GIS 分析能力的浏览器端实现。',
    lessons: [
      { file: 'lessons/03-spatial-analysis/01-turf-basics.html',     title: '测量与计算',          sub: 'distance / area',       status: 'todo' },
      { file: 'lessons/03-spatial-analysis/02-buffer-query.html',    title: '缓冲区与空间查询',    sub: 'buffer / 命中判断',     status: 'todo' },
    ]
  },
  {
    no: '04', title: '现代矢量渲染与 3D', tech: 'MapLibre GL',
    desc: '矢量瓦片、样式表达式、3D 建筑、DEM 地形渲染 —— 从"看地图"到"进地图"。',
    lessons: [
      { file: 'lessons/04-maplibre/01-vector-style.html',  title: '矢量瓦片与 3D 建筑',  sub: 'Style Spec / extrusion', status: 'todo' },
      { file: 'lessons/04-maplibre/02-3d-terrain.html',    title: '3D 地形',             sub: 'raster-dem / hillshade', status: 'todo' },
    ]
  },
  {
    no: '05', title: '三维地球', tech: 'CesiumJS',
    desc: '真三维地球、Entity 实体、时间动态与 CZML 轨迹动画 —— 数字孪生的入口。',
    lessons: [
      { file: 'lessons/05-cesium/01-first-globe.html',        title: '第一个三维地球',      sub: 'Viewer / Entity',        status: 'todo' },
      { file: 'lessons/05-cesium/02-flight-animation.html',   title: '飞行轨迹与 CZML',     sub: '时序动画 / 追踪',        status: 'todo' },
    ]
  }
];

// 学习日志（与 PROGRESS.md 保持同步）
const LOGS = [
  { date: '2026-08-18', text: '项目启动', detail: '确定学习路线 Leaflet → 交互 → turf → MapLibre → Cesium，搭建进度看板' },
];

// ================= 渲染逻辑（以下无需修改） =================
const fmt = n => `${Math.round(n * 100)}%`;
const ICONS = { done: '✓', doing: '◐', todo: '○' };

const allLessons = STAGES.flatMap(s => s.lessons);
const doneCount = allLessons.filter(l => l.status === 'done').length;
const doingCount = allLessons.filter(l => l.status === 'doing').length;
const total = allLessons.length;
const progress = total ? (doneCount + doingCount * 0.5) / total : 0;
const days = Math.max(1, Math.ceil((Date.now() - new Date(START_DATE)) / 864e5));

// 统计卡
document.getElementById('stats').innerHTML = [
  { num: doneCount + doingCount, label: '已完成 / 进行中', cls: 'c-green' },
  { num: total,                  label: '课程总数',       cls: 'c-sky' },
  { num: fmt(progress),          label: '总进度',         cls: 'c-violet' },
  { num: days,                   label: '学习天数',       cls: 'c-amber' },
].map(s => `<div class="stat"><div class="num ${s.cls}">${s.num}</div><div class="label">${s.label}</div></div>`).join('');

// 总进度条（带动画）
setTimeout(() => {
  document.getElementById('overall-bar').style.width = fmt(progress);
  document.getElementById('overall-text').textContent = `${fmt(progress)} · ${doneCount}/${total} 完成`;
}, 150);

// 路线图
document.getElementById('roadmap').innerHTML = STAGES.map(stage => {
  const d = stage.lessons.filter(l => l.status === 'done').length;
  const p = d / stage.lessons.length;
  const state = d === stage.lessons.length ? 'done' : (stage.lessons.some(l => l.status !== 'todo') ? 'doing' : '');
  return `
  <div class="stage ${state}">
    <div class="stage-dot">${ICONS[d === stage.lessons.length ? 'done' : (p > 0 ? 'doing' : 'todo')]}</div>
    <div class="stage-card">
      <div class="stage-head">
        <span class="no">STAGE ${stage.no}</span>
        <h3>${stage.title}</h3>
        <span class="tech">${stage.tech}</span>
      </div>
      <p class="stage-desc">${stage.desc}</p>
      <div class="stage-progress">
        <div class="bar"><div style="width:${p * 100}%"></div></div>
        <span>${d}/${stage.lessons.length}</span>
      </div>
      <div class="lessons">
        ${stage.lessons.map(l => `
          <a class="lesson ${l.status}" href="${l.file}" target="_blank">
            <span class="icon">${ICONS[l.status]}</span>
            <span><span class="title">${l.title}</span><br><span class="sub">${l.sub}</span></span>
            <span class="arrow">→</span>
          </a>`).join('')}
      </div>
    </div>
  </div>`;
}).join('');

// 时间线
document.getElementById('timeline').innerHTML = LOGS.map(l => `
  <div class="tl-item">
    <div class="tl-date">${l.date}</div>
    <div class="tl-body"><b>${l.text}</b><br><span class="muted">${l.detail}</span></div>
  </div>`).join('');
</script>
</body>
</html>
