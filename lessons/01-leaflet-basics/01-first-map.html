<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1.1 我的第一个地图 · Leaflet 入门</title>
  <!-- 第一步：引入 Leaflet 的 CSS 和 JS（CDN 方式，最简单的接入方式） -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    /* 地图容器必须有明确的高度，否则地图不显示 —— 新手第一大坑！ */
    #map { height: 100vh; }
    .info-panel {
      position: absolute; top: 12px; right: 12px; z-index: 1000;
      background: rgba(255,255,255,.95); padding: 14px 18px; border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,.15); font-size: 13px; line-height: 1.8;
      max-width: 320px; font-family: system-ui, sans-serif;
    }
    .info-panel h3 { margin: 0 0 6px; font-size: 15px; }
    .info-panel code { background: #f0f0f0; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>

  <!-- 地图挂载点：Leaflet 会把地图渲染到这个 div 里 -->
  <div id="map"></div>

  <div class="info-panel">
    <h3>🗺️ 1.1 第一个地图</h3>
    <div id="status">鼠标在地图上移动，这里会显示当前坐标</div>
  </div>

  <script>
    // ============================================================
    // 核心三步曲：初始化地图 → 设置中心点/缩放 → 添加瓦片图层
    // ============================================================

    // 1. 初始化地图，绑定到 #map 容器
    //    setView([纬度, 经度], 缩放级别)
    //    注意：Leaflet 用 [lat, lng]（纬度在前），和 GeoJSON 的 [lng, lat] 相反！
    const map = L.map('map').setView([39.9042, 116.4074], 10); // 北京，10级

    // 2. 添加瓦片图层（TileLayer）
    //    瓦片地图 = 无数张 256x256 的小图片按 XYZ 规则拼成
    //    {z} 缩放级别 / {x} 列号 / {y} 行号
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,                          // 最大缩放级别
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' // 版权声明（法律要求）
    }).addTo(map);

    // 3. 添加一个标记（Marker）验证地图工作正常
    const marker = L.marker([39.9042, 116.4074])
      .addTo(map)
      .bindPopup('<b>北京</b><br>我的第一个 WebGIS 标记点 🎉');

    // ------------------------------------------------------------
    // 扩展：监听地图事件，实时显示鼠标坐标
    // ------------------------------------------------------------
    map.on('mousemove', (e) => {
      document.getElementById('status').innerHTML =
        `经度: ${e.latlng.lng.toFixed(5)}<br>纬度: ${e.latlng.lat.toFixed(5)}<br>缩放: ${map.getZoom()}`;
    });

    // 常用地图方法速查：
    // map.setZoom(14)                    设置缩放
    // map.flyTo([31.23, 121.47], 12)     平滑飞到某地
    // map.fitBounds([[30, 110], [40, 120]])  自动缩放到范围
    // map.on('click', e => ...)          点击事件
  </script>
</body>
</html>
