<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>1.4 分级统计图（Choropleth）· Leaflet 入门</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { height: 100vh; }
    .legend {
      position: absolute; bottom: 24px; right: 12px; z-index: 1000;
      background: rgba(255,255,255,.95); padding: 12px 16px; border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,.15); font-size: 13px; line-height: 1.7;
      font-family: system-ui, sans-serif;
    }
    .legend h4 { margin: 0 0 6px; }
    .legend .swatch { display: inline-block; width: 24px; height: 12px; margin-right: 8px; vertical-align: middle; border-radius: 2px; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="legend" id="legend">
    <h4>示例数据：各区指数</h4>
    <div id="legend-body"></div>
  </div>

  <script>
    // ============================================================
    // Choropleth（分级统计图）：按属性值给面要素着色
    // 数据分析地图的经典形式。本课用简化数据演示完整流程。
    // ============================================================

    const map = L.map('map').setView([39.9042, 116.4074], 10);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // --- 1. 属性数据（实际项目来自数据库或 API）---
    const stats = {
      '东城': 92, '西城': 88, '朝阳': 76, '海淀': 95,
      '丰台': 64, '石景山': 58, '通州': 47, '顺义': 52,
      '大兴': 41, '房山': 38
    };

    // --- 2. 简化的示意边界（实际项目用真实行政区 GeoJSON，可从天地图/阿里 DataV 获取）---
    const districts = {
      "type": "FeatureCollection",
      "features": [
        { "type": "Feature", "properties": { "name": "东城" },   "geometry": { "type": "Polygon", "coordinates": [[[116.40,39.87],[116.45,39.87],[116.45,39.93],[116.40,39.93],[116.40,39.87]]] } },
        { "type": "Feature", "properties": { "name": "西城" },   "geometry": { "type": "Polygon", "coordinates": [[[116.34,39.87],[116.40,39.87],[116.40,39.93],[116.34,39.93],[116.34,39.87]]] } },
        { "type": "Feature", "properties": { "name": "朝阳" },   "geometry": { "type": "Polygon", "coordinates": [[[116.45,39.83],[116.58,39.83],[116.58,39.97],[116.45,39.97],[116.45,39.83]]] } },
        { "type": "Feature", "properties": { "name": "海淀" },   "geometry": { "type": "Polygon", "coordinates": [[[116.24,39.92],[116.36,39.92],[116.36,40.02],[116.24,40.02],[116.24,39.92]]] } },
        { "type": "Feature", "properties": { "name": "丰台" },   "geometry": { "type": "Polygon", "coordinates": [[[116.30,39.80],[116.44,39.80],[116.44,39.87],[116.30,39.87],[116.30,39.80]]] } },
        { "type": "Feature", "properties": { "name": "石景山" }, "geometry": { "type": "Polygon", "coordinates": [[[116.17,39.88],[116.26,39.88],[116.26,39.97],[116.17,39.97],[116.17,39.88]]] } },
        { "type": "Feature", "properties": { "name": "通州" },   "geometry": { "type": "Polygon", "coordinates": [[[116.58,39.75],[116.75,39.75],[116.75,39.95],[116.58,39.95],[116.58,39.75]]] } },
        { "type": "Feature", "properties": { "name": "顺义" },   "geometry": { "type": "Polygon", "coordinates": [[[116.55,40.00],[116.72,40.00],[116.72,40.15],[116.55,40.15],[116.55,40.00]]] } },
        { "type": "Feature", "properties": { "name": "大兴" },   "geometry": { "type": "Polygon", "coordinates": [[[116.30,39.60],[116.55,39.60],[116.55,39.78],[116.30,39.78],[116.30,39.60]]] } },
        { "type": "Feature", "properties": { "name": "房山" },   "geometry": { "type": "Polygon", "coordinates": [[[115.95,39.60],[116.25,39.60],[116.25,39.86],[115.95,39.86],[115.95,39.60]]] } }
      ]
    };

    // --- 3. 分级配色（Color Brewer 风格，色盲友好）---
    // getColor 是所有 choropleth 地图的通用模板函数
    function getColor(d) {
      return d > 85 ? '#08519c' :
             d > 70 ? '#3182bd' :
             d > 55 ? '#6baed6' :
             d > 42 ? '#9ecae1' :
                      '#deebf7';
    }

    const geojson = L.geoJSON(districts, {
      style: (feature) => {
        const value = stats[feature.properties.name] ?? 0;
        return {
          fillColor: getColor(value),
          weight: 1.5,
          opacity: 1,
          color: '#fff',
          fillOpacity: 0.75
        };
      },
      onEachFeature: (feature, layer) => {
        const name = feature.properties.name;
        const value = stats[name] ?? '无数据';
        layer.bindPopup(`<b>${name}</b><br>指数: ${value}`);
        // 高亮交互
        layer.on('mouseover', () => layer.setStyle({ weight: 3, color: '#f59e0b', fillOpacity: 0.9 }));
        layer.on('mouseout',  () => geojson.resetStyle(layer));
      }
    }).addTo(map);

    map.fitBounds(geojson.getBounds().pad(0.1));

    // --- 4. 图例（Legend）：读图的必备元素 ---
    const grades = [0, 42, 55, 70, 85];
    let legendHtml = '';
    for (let i = 0; i < grades.length; i++) {
      legendHtml += `
        <div>
          <span class="swatch" style="background:${getColor(grades[i] + 1)}"></span>
          ${grades[i]}${grades[i + 1] ? ` – ${grades[i + 1]}` : '+'}
        </div>`;
    }
    document.getElementById('legend-body').innerHTML = legendHtml;

    // 💡 实战提示：
    // - 真实行政区边界可从阿里云 DataV.GeoAtlas 免费下载：
    //   https://datav.aliyun.com/portal/school/atlas/area_selector
    // - 配色推荐 colorbrewer2.org（地图配色的事实标准）
    //
    // 📝 小作业：
    // 1. 把 stats 数据换成你自己编的一组值，观察地图变化
    // 2. 下载一个真实省界 GeoJSON（DataV），替换 districts 渲染省级 choropleth
    // 3. 进阶：点击区域时在侧边栏显示该区详情（而不是弹窗）
  </script>
</body>
</html>
