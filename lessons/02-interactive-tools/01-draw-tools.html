<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>2.1 绘制与编辑工具 · 地图交互</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free/dist/leaflet-geoman.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free/dist/leaflet-geoman.min.js"></script>
  <style>
    #map { height: 100vh; }
    .output {
      position: absolute; bottom: 12px; left: 12px; z-index: 1000;
      background: rgba(15,23,42,.92); color: #e2e8f0; padding: 14px 18px;
      border-radius: 10px; font-family: Consolas, monospace; font-size: 12.5px;
      max-width: 460px; max-height: 40vh; overflow: auto; line-height: 1.7;
      box-shadow: 0 4px 16px rgba(0,0,0,.4);
    }
    .output h4 { margin: 0 0 6px; color: #7dd3fc; font-size: 13px; }
    .output button {
      margin-top: 8px; padding: 5px 12px; border: none; border-radius: 6px;
      background: #0ea5e9; color: #fff; cursor: pointer; font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="output">
    <h4>已绘制图形（GeoJSON 实时输出）</h4>
    <div id="result">使用地图右上角工具条：绘制点 / 线 / 面 / 矩形 / 圆<br>绘制完成后可拖拽顶点编辑，试试"编辑"和"删除"模式</div>
    <button onclick="navigator.clipboard.writeText(JSON.stringify(drawnItems.toGeoJSON(), null, 2)).then(()=>alert('GeoJSON 已复制到剪贴板'))">复制 GeoJSON</button>
  </div>

  <script>
    // ============================================================
    // Leaflet-Geoman：最流行的 Leaflet 绘制/编辑插件
    // 功能：画点、线、面、矩形、圆，拖拽编辑顶点，剪切、合并
    // ============================================================

    const map = L.map('map').setView([39.9042, 116.4074], 12);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // 绘制的图形统一放进一个 FeatureGroup，便于整体导出
    const drawnItems = L.featureGroup().addTo(map);

    // 全局语言设置 + 把绘制图层指定给工具条
    map.pm.setGlobalOptions({
      pathOptions: { color: '#0ea5e9', fillColor: '#0ea5e9', fillOpacity: 0.2 },
      allowSelfIntersection: false
    });
    map.pm.addControls({
      position: 'topright',
      drawMarker: true, drawCircleMarker: false,
      drawPolyline: true, drawPolygon: true,
      drawRectangle: true, drawCircle: true,
      editMode: true, dragMode: true,
      cutPolygon: false, removalMode: true
    });
    map.pm.enableDraw('Polygon'); // 初始激活面绘制

    // --- 监听绘制完成事件，输出 GeoJSON ---
    const resultEl = document.getElementById('result');

    function refresh() {
      const gj = drawnItems.toGeoJSON();
      resultEl.innerHTML = gj.features.length === 0
        ? '暂无图形，请绘制'
        : gj.features.map(f => {
            const type = f.geometry.type;
            let extra = '';
            if (type === 'Point') extra = f.geometry.coordinates.map(n => n.toFixed(5)).join(', ');
            return `▸ <b style="color:#7dd3fc">${type}</b> ${extra}`;
          }).join('<br>');
    }

    map.on('pm:create', (e) => {
      drawnItems.addLayer(e.layer);
      // 给每个图形绑定提示信息
      e.layer.bindTooltip(`双击可查看数据`, { sticky: true });
      refresh();
    });
    map.on('pm:remove', refresh);

    // 实战场景：采集 POI、圈选范围、标绘业务区域后提交后端
    // 提交时：drawnItems.toGeoJSON() → JSON.stringify → fetch POST
    const demoSubmit = () => {
      const payload = JSON.stringify(drawnItems.toGeoJSON());
      console.log('提交到后端的数据:', payload);
      // await fetch('/api/features', { method:'POST', body: payload, headers:{'Content-Type':'application/json'} })
    };

    // 📝 小作业：
    // 1. 画一个圆和一个矩形，导出 GeoJSON，观察圆是如何被表示的（提示：Leaflet 的圆导出为 Point + radius 属性）
    // 2. 给绘制完成的图形自动计算面积并显示在 tooltip（下一阶段学 turf 后回来看）
    // 3. 尝试限制只能绘制一个图形（提示：pm:create 时先 clearLayers）
  </script>
</body>
</html>
