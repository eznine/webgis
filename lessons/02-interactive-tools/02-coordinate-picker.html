<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>2.2 坐标拾取、坐标系与图层控制 · 地图交互</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { height: 100vh; }
    .panel {
      position: absolute; top: 12px; left: 60px; z-index: 1000;
      background: rgba(255,255,255,.96); padding: 14px 18px; border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,.15); font-size: 13px; line-height: 1.9;
      font-family: system-ui, sans-serif; min-width: 300px;
    }
    .panel h4 { margin: 0 0 6px; font-size: 14px; }
    .panel code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    .copy-btn { padding: 4px 10px; border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; font-size: 12px; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="panel">
    <h4>📍 坐标拾取器（点击地图任意位置）</h4>
    <div id="coord">— 点击地图 —</div>
    <div style="margin-top:6px">
      <button class="copy-btn" onclick="pickCopy('wgs84')">复制 [lng, lat]</button>
      <button class="copy-btn" style="background:#16a34a" onclick="pickCopy('gcj02')">转 GCJ-02 并复制</button>
    </div>
    <div style="margin-top:8px;color:#666;font-size:12px">
      💡 中国互联网地图的坐标偏移：<br>
      WGS-84（GPS/OSM）→ GCJ-02（高德/腾讯）→ BD-09（百度）
    </div>
  </div>

  <script>
    // ============================================================
    // 本课三个主题：
    // ① 坐标拾取  ② 坐标系偏移转换  ③ 底图切换与图层控制
    // ============================================================

    // --- ① ③ 多底图 + 图层切换控件 ---
    const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
    });
    const cartoDark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 20, attribution: '&copy; OpenStreetMap &copy; CARTO'
    });
    const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      maxZoom: 17, attribution: '&copy; OpenTopMap'
    });
    // 加一个透明叠加层（Overlay），演示 baseLayer 与 overlay 的区别
    const hillshade = L.tileLayer('https://tiles.wmflabs.org/hillshading/{z}/{x}/{y}.png', {
      maxZoom: 16, opacity: 0.5
    });

    const map = L.map('map', {
      center: [39.9042, 116.4074], zoom: 11,
      layers: [osm]                             // 默认底图
    });

    // 图层控件：第一组互斥（底图），第二组可多选（叠加层）
    L.control.layers({
      'OSM 标准图': osm,
      '暗色图 (CARTO)': cartoDark,
      '地形图 (OpenTopoMap)': topo
    }, {
      '山体阴影 (叠加层)': hillshade
    }, { position: 'topleft', collapsed: false }).addTo(map);

    // 比例尺控件（正式项目标配）
    L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(map);

    // --- ① 坐标拾取 ---
    let lastClick = null;
    const coordEl = document.getElementById('coord');

    map.on('click', (e) => {
      lastClick = e.latlng;
      const lng = e.latlng.lng, lat = e.latlng.lat;
      const gcj = wgs84ToGcj02(lng, lat);
      coordEl.innerHTML = `
        WGS-84: <code>${lng.toFixed(6)}, ${lat.toFixed(6)}</code><br>
        GCJ-02: <code>${gcj[0].toFixed(6)}, ${gcj[1].toFixed(6)}</code><br>
        <span style="color:#666;font-size:12px">偏移量: ${(gcj[0]-lng).toFixed(6)}, ${(gcj[1]-lat).toFixed(6)}</span>
      `;
      L.popup().setLatLng(e.latlng)
        .setContent(`<code>${lng.toFixed(6)}, ${lat.toFixed(6)}</code>`)
        .openOn(map);
    });

    function pickCopy(mode) {
      if (!lastClick) return alert('请先点击地图拾取坐标');
      const text = mode === 'wgs84'
        ? `${lastClick.lng.toFixed(6)}, ${lastClick.lat.toFixed(6)}`
        : wgs84ToGcj02(lastClick.lng, lastClick.lat).map(n => n.toFixed(6)).join(', ');
      navigator.clipboard.writeText(text).then(() => alert(`已复制: ${text}`));
    }

    // --- ② WGS-84 → GCJ-02 转换（经典火星坐标算法）---
    // 中国法规要求互联网地图加密偏移，涉及国内底图时几乎绕不开这段代码
    function wgs84ToGcj02(lng, lat) {
      const a = 6378245.0;                        // 长半轴
      const ee = 0.00669342162296594323;          // 偏心率平方
      let dLat = transformLat(lng - 105.0, lat - 35.0);
      let dLng = transformLng(lng - 105.0, lat - 35.0);
      const radLat = lat / 180.0 * Math.PI;
      let magic = Math.sin(radLat);
      magic = 1 - ee * magic * magic;
      const sqrtMagic = Math.sqrt(magic);
      dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
      dLng = (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
      return [lng + dLng, lat + dLat];
    }
    function transformLat(lng, lat) {
      let ret = -100.0 + 2.0 * lng + 3.0 * lat + 0.2 * lat * lat + 0.1 * lng * lat + 0.2 * Math.sqrt(Math.abs(lng));
      ret += (20.0 * Math.sin(6.0 * lng * Math.PI) + 20.0 * Math.sin(2.0 * lng * Math.PI)) * 2.0 / 3.0;
      ret += (20.0 * Math.sin(lat * Math.PI) + 40.0 * Math.sin(lat / 3.0 * Math.PI)) * 2.0 / 3.0;
      ret += (160.0 * Math.sin(lat / 12.0 * Math.PI) + 320 * Math.sin(lat * Math.PI / 30.0)) * 2.0 / 3.0;
      return ret;
    }
    function transformLng(lng, lat) {
      let ret = 300.0 + lng + 2.0 * lat + 0.1 * lng * lng + 0.1 * lng * lat + 0.1 * Math.sqrt(Math.abs(lng));
      ret += (20.0 * Math.sin(6.0 * lng * Math.PI) + 20.0 * Math.sin(2.0 * lng * Math.PI)) * 2.0 / 3.0;
      ret += (20.0 * Math.sin(lng * Math.PI) + 40.0 * Math.sin(lng / 3.0 * Math.PI)) * 2.0 / 3.0;
      ret += (150.0 * Math.sin(lng / 12.0 * Math.PI) + 300.0 * Math.sin(lng / 30.0 * Math.PI)) * 2.0 / 3.0;
      return ret;
    }

    // 💡 实战提醒：
    // - OSM 底图（WGS-84）上叠高德数据（GCJ-02）会偏移几百米 —— 国内项目最经典的坑
    // - 高德 JS API 自带坐标系转换；Leaflet 生态可用 coordtransform 库
    // - 天地图（WGS-84）与 OSM 一致，可直接混用
    //
    // 📝 小作业：
    // 1. 切换三种底图，观察同一地点的渲染差异
    // 2. 把拾取的 WGS-84 坐标粘到高德地图搜索框，观察偏移
    // 3. 思考：为什么 hillshade 是叠加层而不是底图？
  </script>
</body>
</html>
