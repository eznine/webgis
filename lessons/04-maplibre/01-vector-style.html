<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>4.1 矢量瓦片与 3D 建筑 · MapLibre GL</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    body { margin: 0; }
    #map { height: 100vh; }
    .panel {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: rgba(15,23,42,.9); color: #e2e8f0; padding: 14px 18px;
      border-radius: 10px; font-size: 13px; line-height: 1.8; font-family: system-ui, sans-serif;
      max-width: 330px; backdrop-filter: blur(8px);
    }
    .panel h4 { margin: 0 0 6px; color: #7dd3fc; }
    .panel input { width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="panel">
    <h4>🏙️ 3D 建筑 + 光照动画</h4>
    拖动旋转视角（右键拖动 / Ctrl+拖动）<br>
    建筑高度系数：<span id="h-val">1.0</span>
    <input type="range" min="0" max="3" step="0.1" value="1" oninput="setHeight(this.value)">
    <div style="margin-top:6px;color:#94a3b8;font-size:12px">
      矢量瓦片（MVT）+ WebGL 渲染：<br>单个样式文件控制全部要素的显示规则
    </div>
  </div>

  <script>
    // ============================================================
    // MapLibre GL：Mapbox GL 的开源分支，WebGL 矢量渲染
    // 与 Leaflet 的本质区别：
    //   Leaflet   = DOM/Canvas 栅格拼接，样式写 JS 代码
    //   MapLibre  = GPU 渲染矢量瓦片，样式是一份 JSON（Mapbox Style Spec）
    // ============================================================

    // 免费无 key 矢量瓦片服务：OpenFreeMap（OpenMapTiles 数据）
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',  // 样式 JSON（也可本地化）
      center: [116.4074, 39.9042],   // 注意：MapLibre 是 [lng, lat]！
      zoom: 15.5,
      pitch: 55,                     // 倾斜角（3D 感的来源）
      bearing: -20,                  // 旋转角
      antialias: true                // 3D 建筑需要抗锯齿
    });
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));

    let heightFactor = 1;
    function setHeight(v) {
      heightFactor = parseFloat(v);
      document.getElementById('h-val').textContent = heightFactor.toFixed(1);
      // setPaintProperty：运行时动态改样式 —— MapLibre 的核心能力
      map.setPaintProperty('3d-buildings', 'fill-extrusion-height',
        ['*', ['get', 'render_height'], heightFactor]);
    }

    map.on('load', () => {
      // --- 添加 3D 建筑图层（fill-extrusion：拉伸体）---
      // 图层插在 label 图层之下，避免文字被建筑遮挡
      const layers = map.getStyle().layers;
      const labelLayer = layers.find(l => l.type === 'symbol' && l.layout && l.layout['text-field']);
      map.addLayer({
        id: '3d-buildings',
        source: 'openmaptiles',               // 样式文件里已有的矢量源
        'source-layer': 'building',           // 矢量瓦片里的图层名
        type: 'fill-extrusion',
        minzoom: 14,
        paint: {
          'fill-extrusion-color': [
            'interpolate', ['linear'], ['get', 'render_height'],  // 数据驱动配色
            0, '#dcd7cd', 20, '#c8bfb1', 50, '#a8967a'
          ],
          'fill-extrusion-height': ['*', ['get', 'render_height'], heightFactor],
          'fill-extrusion-base': ['get', 'render_min_height'],     // 底部抬升（天桥效果）
          'fill-extrusion-opacity': 0.85
        }
      }, labelLayer && labelLayer.id);

      // --- 光照动画：太阳角度随时间旋转 ---
      let sun = 0;
      setInterval(() => {
        sun = (sun + 0.5) % 360;
        map.setLight({ anchor: 'viewport', position: [1.5, Math.sin(sun * Math.PI / 180) * 2 + 1, sun / 60], intensity: 0.4 });
      }, 60);

      // --- 点击建筑查询属性（矢量瓦片自带属性，无需后端）---
      map.on('click', '3d-buildings', (e) => {
        const f = e.features[0];
        new maplibregl.Popup()
          .setLngLat(e.lngLat)
          .setHTML(`<b>建筑</b><br>高度: ${Math.round(f.properties.render_height || 0)} m<br>层数: ${f.properties.render_min_height ? '多层' : '单层'}`)
          .addTo(map);
      });
      map.on('mouseenter', '3d-buildings', () => map.getCanvas().style.cursor = 'pointer');
      map.on('mouseleave', '3d-buildings', () => map.getCanvas().style.cursor = '');
    });

    // Mapbox Style 核心概念速查：
    // sources   → 数据从哪来（vector / raster / geojson / raster-dem）
    // layers    → 怎么画（按顺序叠加：background→fill→line→symbol→extrusion）
    // paint     → 绘制属性（可动画、可数据驱动 Data-Driven Styling）
    // layout    → 布局属性（文字、可见性）
    // 表达式    → ['interpolate'] ['get'] ['match'] —— 函数式样式语言

    // 📝 小作业：
    // 1. 把样式换成 'https://tiles.openfreemap.org/styles/bright'，观察差异
    // 2. 调整 pitch/bearing 找到最帅的角度
    // 3. 进阶：用 map.setPaintProperty 做一个按钮，切换建筑白天/夜晚配色
  </script>
</body>
</html>
