<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>4.2 3D 地形与天空 · MapLibre GL</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    body { margin: 0; }
    #map { height: 100vh; }
    .panel {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: rgba(15,23,42,.9); color: #e2e8f0; padding: 14px 18px;
      border-radius: 10px; font-size: 13px; line-height: 1.8; font-family: system-ui, sans-serif;
      backdrop-filter: blur(8px);
    }
    .panel h4 { margin: 0 0 8px; color: #7dd3fc; }
    .panel button {
      padding: 6px 14px; margin: 2px; border: none; border-radius: 6px;
      background: #0ea5e9; color: #fff; cursor: pointer; font-size: 12px;
    }
    #alt { color: #fbbf24; font-weight: 600; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="panel">
    <h4>⛰️ 3D 地形（DEM 高程渲染）</h4>
    鼠标所指处高程：<span id="alt">移动鼠标查看</span><br>
    <button onclick="flyTo([102.75, 25.15], 13, 70)">云南玉龙雪山</button>
    <button onclick="flyTo([101.88, 30.05], 12.5, 65)">四川折多山</button>
    <button onclick="flyTo([116.35, 40.02], 13, 60)">北京海坨山</button>
    <div style="margin-top:6px;color:#94a3b8;font-size:12px">按住 Ctrl 拖动旋转视角 · 滚轮缩放</div>
  </div>

  <script>
    // ============================================================
    // 3D 地形 = DEM（数字高程模型）栅格瓦片 + 顶点位移渲染
    // MapLibre 两大关键 source：
    //   raster-dem → 高程数据（terrarium 编码，AWS 免费开放）
    //   hillshade  → 由 DEM 实时计算山体阴影
    // ============================================================

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          // 卫星影像底图（ESRI World Imagery，免费公开）
          satellite: {
            type: 'raster',
            tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
            tileSize: 256,
            attribution: 'Esri World Imagery'
          }
        },
        layers: [
          { id: 'base', type: 'raster', source: 'satellite' }
        ]
      },
      center: [101.88, 30.05],   // 折多山
      zoom: 12.5, pitch: 65, bearing: -30, antialias: true
    });
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));

    map.on('load', () => {
      // --- 1. 添加高程数据源 ---
      map.addSource('terrain', {
        type: 'raster-dem',
        tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
        encoding: 'terrarium',        // 高程编码格式（把高程值写进 RGB 通道）
        tileSize: 256, maxzoom: 14
      });

      // --- 2. 添加山体阴影层（增强立体感）---
      map.addLayer({
        id: 'hillshading',
        source: 'terrain',
        type: 'hillshade'
      });

      // --- 3. 启用地形（核心一行代码）---
      map.setTerrain({ source: 'terrain', exaggeration: 1.4 });  // exaggeration：垂直夸张系数

      // --- 4. 查询鼠标处高程 ---
      map.on('mousemove', (e) => {
        const terrain = map.queryTerrainElevation(e.lngLat);  // 返回米（相对海平面）
        document.getElementById('alt').textContent =
          terrain != null ? `${Math.round(terrain)} m` : '—';
      });
    });

    function flyTo(center, zoom, pitch) {
      map.flyTo({ center, zoom, pitch, bearing: -30, duration: 3500, essential: true });
    }

    // 💡 知识拓展：
    // - terrarium 编码：elevation = (R*256 + G + B/256) - 32768
    // - 国内可用的高程瓦片：阿里云 DataV、MapTiler（需 key）、AWS Terrain Tiles（本课用的）
    // - 地形夸张 exaggeration：1 = 真实比例，>1 视觉更震撼但失真
    // - Cesium 的地形系统同理（下一阶段），只是 API 和数据格式不同（quantized-mesh）
    //
    // 📝 小作业：
    // 1. 把 exaggeration 改成 0.5 和 3，感受垂直夸张差异
    // 2. 切换到你的家乡，看看有没有有趣的地形
    // 3. 进阶：加一个天空渐变层（sky layer），让远山更真实
  </script>
</body>
</html>
