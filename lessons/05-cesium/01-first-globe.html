<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>5.1 第一个三维地球 · Cesium</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    body { margin: 0; }
    #globe { height: 100vh; }
    .panel {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: rgba(15,23,42,.9); color: #e2e8f0; padding: 14px 18px;
      border-radius: 10px; font-size: 13px; line-height: 1.8; font-family: system-ui, sans-serif;
      backdrop-filter: blur(8px);
    }
    .panel h4 { margin: 0 0 8px; color: #7dd3fc; }
    .panel button {
      padding: 6px 14px; margin: 2px; border: none; border-radius: 6px;
      background: #0ea5e9; color: #fff; cursor: pointer; font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="globe"></div>

  <div class="panel">
    <h4>🌍 Cesium 三维地球</h4>
    <button onclick="flyTo(116.4074, 39.9042, 30000)">北京</button>
    <button onclick="flyTo(121.4737, 31.2304, 30000)">上海</button>
    <button onclick="flyTo(104.1954, 35.8617, 9000000)">中国全貌</button>
    <div style="margin-top:6px;color:#94a3b8;font-size:12px">
      左键拖动旋转 · 滚轮缩放 · 中键倾斜
    </div>
  </div>

  <script>
    // ============================================================
    // CesiumJS：真三维地球引擎（WGS84 空心椭球）
    // 核心概念：
    //   Viewer   → 三维场景容器
    //   Entity   → 面向对象的地理要素（点/线/面/模型，最易用）
    //   Imagery  → 影像底图图层
    //   Camera   → flyTo 相机飞行
    // ============================================================

    // 免 ion token 方案：OSM 影像 + 默认椭球地形
    const viewer = new Cesium.Viewer('globe', {
      imageryProvider: new Cesium.OpenStreetMapImageryProvider({
        url: 'https://tile.openstreetmap.org/'
      }),
      baseLayerPicker: false,     // 简化界面（自带的选择器需要 ion）
      geocoder: false,            // 同上
      animation: false, timeline: false,
      infoBox: true
    });
    viewer.scene.globe.enableLighting = true;   // 开启昼夜光照（转到背阳面看看！）

    // --- 相机飞行 ---
    function flyTo(lng, lat, height) {
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(lng, lat, height),
        orientation: { heading: Cesium.Math.toRadians(0), pitch: Cesium.Math.toRadians(-45), roll: 0 },
        duration: 3
      });
    }

    // --- Entity：点（带标签）---
    viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(116.4074, 39.9042, 0),
      point: { pixelSize: 12, color: Cesium.Color.RED, outlineColor: Cesium.Color.WHITE, outlineWidth: 2 },
      label: { text: '北京', font: '16px sans-serif', fillColor: Cesium.Color.WHITE,
               pixelOffset: new Cesium.Cartesian2(0, -22), showBackground: true }
    });

    // --- Entity：拉伸体（3D 建筑/白模）---
    // extrudedHeight 是 Cesium 做"白模城市"的基础
    viewer.entities.add({
      name: '3D 街区',
      polygon: {
        hierarchy: Cesium.Cartesian3.fromDegreesArray([
          116.390, 39.900, 116.410, 39.900, 116.412, 39.915, 116.388, 39.914
        ]),
        extrudedHeight: 500,               // 拉伸高度（米）
        material: Cesium.Color.CYAN.withAlpha(0.55),
        outline: true, outlineColor: Cesium.Color.WHITE
      }
    });

    // --- Entity：动态位置（时间动画入门）---
    // SampledPosition：按时刻插值的位置 —— 卫星/飞机/车辆轨迹的基础
    const start = Cesium.JulianDate.fromIso8601('2026-08-18T00:00:00Z');
    viewer.clock.currentTime = start.clone();

    function markerAt(degsPerSecond) {
      const property = new Cesium.SampledPositionProperty();
      for (let t = 0; t <= 60; t += 5) {
        const time = Cesium.JulianDate.addSeconds(start, t, new Cesium.JulianDate());
        property.addSample(time, Cesium.Cartesian3.fromDegrees(100 + t * degsPerSecond, 30 + t * 0.2, 500000));
      }
      return viewer.entities.add({
        position: property,
        point: { pixelSize: 10, color: Cesium.Color.LIME },
        path: { leadTime: 60, trailTime: 60, width: 3, material: new Cesium.PolylineGlowMaterialProperty({ color: Cesium.Color.LIME }) }
      });
    }
    markerAt(0.8);

    viewer.zoomTo(viewer.entities);

    // 💡 实战提示：
    // - 正式项目申请免费的 Cesium ion token 后可解锁：
    //   Cesium World Terrain（全球地形）、OSM Buildings（全球 3D 白模）、Bing 影像
    // - 中国大陆常用替代：NDVI 天地图影像、自建 GeoServer/3D Tiles 服务
    // - 大规模数据不要用 Entity（性能差），改用 Primitive API
    //
    // 📝 小作业：
    // 1. 关闭 enableLighting，对比效果；把地球转到夜晚一面
    // 2. 把白模街区改成你的城市坐标，并调 extrudedHeight
    // 3. 进阶：注册 ion token（免费），换成 Cesium World Terrain 感受真地形
  </script>
</body>
</html>
