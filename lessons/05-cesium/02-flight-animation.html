<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>5.2 飞行轨迹与 CZML 动画 · Cesium</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    body { margin: 0; }
    #globe { height: 100vh; }
    .cesium-viewer-animationContainer, .cesium-viewer-timelineContainer { display: none; }
    .hud {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: rgba(15,23,42,.88); color: #e2e8f0; padding: 14px 18px;
      border-radius: 10px; font-size: 13px; line-height: 1.8; font-family: system-ui, sans-serif;
      backdrop-filter: blur(8px);
    }
    .hud h4 { margin: 0 0 6px; color: #7dd3fc; }
    .hud b { color: #fbbf24; }
  </style>
</head>
<body>
  <div id="globe"></div>

  <div class="hud">
    <h4>✈️ 航班轨迹回放（CZML 数据驱动）</h4>
    北京 → 伦敦 直飞模拟<br>
    高度：<b id="alt">-</b> 速度：<b id="spd">-</b>
    <div style="color:#94a3b8;font-size:12px;margin-top:4px">点击飞机查看实时信息</div>
  </div>

  <script>
    // ============================================================
    // CZML：Cesium 的时序数据格式（GeoJSON 的"时间增强版"）
    // 数字孪生场景的标配：轨迹回放、实时目标追踪
    // 结构：一个 JSON 数组，第一个元素是文档头，其余是实体
    // ============================================================

    const viewer = new Cesium.Viewer('globe', {
      imageryProvider: new Cesium.OpenStreetMapImageryProvider({ url: 'https://tile.openstreetmap.org/' }),
      baseLayerPicker: false, geocoder: false, animation: false, timeline: false,
      shouldAnimate: true
    });

    // --- 1. 生成航线路径点（大圆插值，京→伦敦）---
    const [lngA, latA] = [116.4074, 39.9042];   // 北京
    const [lngB, latB] = [-0.1276, 51.5072];    // 伦敦
    const N = 40, TOTAL_SEC = 3600;             // 一小时（加速回放）
    const epoch = Cesium.JulianDate.fromIso8601('2026-08-18T08:00:00Z');

    const cartesians = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const lat = latA + (latB - latA) * t;
      let lng = lngA + (lngB - lngA) * t;
      if (lng > 180) lng -= 360;                              // 跨经度处理
      const alt = 10500 * Math.sin(Math.PI * t) + 300;        // 抛物线巡航高度
      cartesians.push(Cesium.Cartesian3.fromDegrees(lng, lat, alt));
    }

    // --- 2. 手工构造 CZML ---
    const czml = [{
      id: 'document',
      name: 'CZML flight',
      version: '1.0',
      clock: { interval: '2026-08-18T08:00:00Z/2026-08-18T09:00:00Z',
               currentTime: '2026-08-18T08:00:00Z',
               multiplier: 120, range: 'LOOP_STOPPED' }        // 120倍速播放
    }, {
      id: 'flight',
      name: 'CA937 北京-伦敦',
      position: {
        epoch: '2026-08-18T08:00:00Z',
        cartographicDegrees: cartesians.flatMap((c, i) => {
          const carto = Cesium.Cartographic.fromCartesian(c);
          return [i * (TOTAL_SEC / N), Cesium.Math.toDegrees(carto.longitude),
                  Cesium.Math.toDegrees(carto.latitude), carto.height];
        })
      },
      point: { pixelSize: 10, color: { rgba: [250, 204, 21, 255] } },
      path: { width: 3, leadTime: 0, trailTime: 1200,
              material: { polylineGlow: { color: { rgba: [250, 204, 21, 160] }, glowPower: 0.3 } } },
      label: { text: 'CA937', font: '14px sans-serif', fillColor: { rgba: [255,255,255,255] },
               pixelOffset: { cartesian2: [0, -18] }, showBackground: true }
    }, {
      // 起终点城市标记
      id: 'beijing',
      position: { cartographicDegrees: [116.4074, 39.9042, 0] },
      point: { pixelSize: 8, color: { rgba: [56, 189, 248, 255] } },
      label: { text: '北京 PEK', font: '13px sans-serif', fillColor: { rgba: [255,255,255,255] }, pixelOffset: { cartesian2: [0, -16] } }
    }, {
      id: 'london',
      position: { cartographicDegrees: [-0.1276, 51.5072, 0] },
      point: { pixelSize: 8, color: { rgba: [56, 189, 248, 255] } },
      label: { text: '伦敦 LHR', font: '13px sans-serif', fillColor: { rgba: [255,255,255,255] }, pixelOffset: { cartesian2: [0, -16] } }
    }];

    // --- 3. 加载 CZML（返回 Promise<EntityCollection>）---
    const flightPromise = Cesium.CzmlDataSource.load(czml);
    viewer.dataSources.add(flightPromise).then(() => {
      const flight = viewer.entities.getById('flight');
      viewer.trackedEntity = flight;    // 相机跟随实体 —— 追踪模式
      viewer.clock.shouldAnimate = true;

      // HUD：每帧读取实体当前位置
      viewer.scene.postRender.addEventListener(() => {
        const pos = flight.position.getValue(viewer.clock.currentTime);
        if (!pos) return;
        const carto = Cesium.Cartographic.fromCartesian(pos);
        document.getElementById('alt').textContent = `${Math.round(carto.height)} m`;
        const next = flight.position.getValue(Cesium.JulianDate.addSeconds(viewer.clock.currentTime, 1, new Cesium.JulianDate()));
        if (next) {
          const dist = Cesium.Cartesian3.distance(pos, next);
          document.getElementById('spd').textContent = `${Math.round(dist * 3.6)} km/h`;
        }
      });
    });

    // 💡 实战场景延伸：
    // - 实时追踪：后端 WebSocket 推 CZML 增量，Cesium.processCzml 增量更新
    // - glTF 模型：Entity 加 model: { uri: 'plane.glb' }（比点标记更炫）
    // - 3D Tiles：倾斜摄影/BIM 的标准格式（数字孪生核心，需要专门服务端）
    //
    // 📝 小作业：
    // 1. 把航线换成任意两个城市，调整抛物线最高点
    // 2. 把 point 换成 glTF 飞机模型（可用 https://sandcastle.cesium.com 的示例模型）
    // 3. 进阶：加第二架飞机，实现双机编队
  </script>
</body>
</html>
